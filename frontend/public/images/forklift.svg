<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <!-- Body frame -->
  <rect x="50" y="70" width="110" height="60" rx="8" fill="currentColor" opacity="0.15"/>
  <rect x="50" y="70" width="110" height="60" rx="8" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  <!-- Cabin -->
  <path d="M100 40 L100 70 L160 70 L160 55 Q160 40 145 40 Z" fill="currentColor" opacity="0.2"/>
  <path d="M100 40 L100 70 L160 70 L160 55 Q160 40 145 40 Z" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  <!-- Mast (vertical) -->
  <rect x="22" y="20" width="6" height="110" rx="2" fill="currentColor" opacity="0.35"/>
  <rect x="36" y="20" width="6" height="110" rx="2" fill="currentColor" opacity="0.35"/>
  <!-- Forks -->
  <rect x="10" y="120" width="40" height="6" rx="2" fill="currentColor" opacity="0.5"/>
  <rect x="10" y="134" width="40" height="6" rx="2" fill="currentColor" opacity="0.5"/>
  <!-- Carriage (fork holder) -->
  <rect x="42" y="112" width="12" height="34" rx="3" fill="currentColor" opacity="0.3"/>
  <!-- Rear wheel -->
  <circle cx="140" cy="140" r="22" fill="currentColor" opacity="0.1"/>
  <circle cx="140" cy="140" r="22" stroke="currentColor" stroke-width="2.5" opacity="0.4"/>
  <circle cx="140" cy="140" r="12" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
  <!-- Front wheel -->
  <circle cx="72" cy="140" r="16" fill="currentColor" opacity="0.1"/>
  <circle cx="72" cy="140" r="16" stroke="currentColor" stroke-width="2.5" opacity="0.4"/>
  <circle cx="72" cy="140" r="8" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
  <!-- Steering wheel hint -->
  <circle cx="130" cy="62" r="7" stroke="currentColor" stroke-width="1.5" opacity="0.3" fill="none"/>
  <!-- Exhaust / engine vent -->
  <rect x="155" y="85" width="14" height="8" rx="2" fill="currentColor" opacity="0.15"/>
  <rect x="155" y="97" width="14" height="8" rx="2" fill="currentColor" opacity="0.15"/>
  <!-- Overhead guard bars -->
  <line x1="105" y1="38" x2="105" y2="70" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
  <line x1="155" y1="38" x2="155" y2="55" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
  <!-- Load on forks -->
  <rect x="6" y="90" width="36" height="28" rx="4" stroke="currentColor" stroke-width="1.5" opacity="0.2" stroke-dasharray="4 3"/>
</svg>
