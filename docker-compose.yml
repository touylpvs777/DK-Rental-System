version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dk-backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://dk_user:dk_pass_2025@db:5432/dk_crm
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dk-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: dk-db
    environment:
      POSTGRES_USER: dk_user
      POSTGRES_PASSWORD: dk_pass_2025
      POSTGRES_DB: dk_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dk_user -d dk_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
